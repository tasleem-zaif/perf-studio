version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# PerfStudio — All-in-one Docker Compose
#
# Single container: Node.js backend + React frontend + Java + JMeter + K6 + Git
#
# Quick start:
#   1. cp .env.docker.example .env.docker
#   2. Edit .env.docker (set JWT_SECRET and ENCRYPTION_KEY)
#   3. docker compose up -d
#   4. Open http://localhost:3001
#
# Build image first (if not pulling from registry):
#   docker compose build
# ─────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    container_name: perf_studio_pg
    environment:
      POSTGRES_DB: perf_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  PerfStudio:
    image: ${PerfStudio_IMAGE:-tasleemzaif/PerfStudio:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: PerfStudio
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: "3001"
      EXECUTION_MODE: native          # use built-in JMeter + K6 (no Docker needed)
      PROJECTS_ROOT: /app/projects
      BACKUPS_ROOT: /app/backups
      JMETER_HOME: /opt/jmeter
      K6_BIN: /usr/bin/k6
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/perf_studio
    volumes:
      - PerfStudio_projects:/app/projects # project files, scripts, test data
      - PerfStudio_git:/app/git-workspaces
      - PerfStudio_backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  pg_data:
  PerfStudio_projects:
  PerfStudio_git:
  PerfStudio_backups:
