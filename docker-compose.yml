version: '3.9'

# ── PerfStudio — Docker Compose ───────────────────────────────────────────────
#
# Quick start:
#   1. cp .env.example .env   (then edit .env)
#   2. Set HOST_PROJECTS_ROOT to the absolute path of ./projects on your machine
#   3. Set JWT_SECRET to a random string
#   4. docker compose up -d
#
# Pull from Docker Hub (no build required):
#   BACKEND_IMAGE=tasleemzaif/perf-studio-backend:latest
#   FRONTEND_IMAGE=tasleemzaif/perf-studio-frontend:latest
#   docker compose up -d
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-tasleemzaif/perf-studio-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: perfstudio-backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./backend/data:/app/data            # SQLite database
      - ./projects:/data/projects           # Project files
      - ./backups:/data/backups             # Backup ZIPs
      - /var/run/docker.sock:/var/run/docker.sock  # Docker-in-Docker
    environment:
      PORT: "3001"
      NODE_ENV: "${NODE_ENV:-production}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:${FRONTEND_PORT:-5173}}"
      PROJECTS_ROOT: "/data/projects"
      BACKUPS_ROOT: "/data/backups"
      HOST_PROJECTS_ROOT: "${HOST_PROJECTS_ROOT}"
      JWT_SECRET: "${JWT_SECRET:-CHANGE_ME_before_production}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"
      JMETER_DOCKER_IMAGE: "${JMETER_DOCKER_IMAGE:-justb4/jmeter:latest}"
      K6_DOCKER_IMAGE: "${K6_DOCKER_IMAGE:-grafana/k6:latest}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:-tasleemzaif/perf-studio-frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: perfstudio-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
