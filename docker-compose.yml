version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Peako — All-in-one Docker Compose
#
# Single container: Node.js backend + React frontend + Java + JMeter + K6 + Git
#
# Quick start:
#   1. cp .env.docker.example .env.docker
#   2. Edit .env.docker (set JWT_SECRET and ENCRYPTION_KEY)
#   3. docker compose up -d
#   4. Open http://localhost:3001
#
# Build image first (if not pulling from registry):
#   docker compose build
# ─────────────────────────────────────────────────────────────────────────────

services:

  Peako:
    image: ${Peako_IMAGE:-tasleemzaif/Peako:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Peako
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: "3001"
      EXECUTION_MODE: native          # use built-in JMeter + K6 (no Docker needed)
      PROJECTS_ROOT: /app/projects
      BACKUPS_ROOT: /app/backups
      JMETER_HOME: /opt/jmeter
      K6_BIN: /usr/bin/k6
    volumes:
      - Peako_data:/app/data         # SQLite database
      - Peako_projects:/app/projects # project files, scripts, test data
      - Peako_git:/app/git-workspaces
      - Peako_backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
